scrub:
  model: de_core_news_lg
  replace: "[ZENSIERT]"
  entity_label:
    - "PER"
    - "PERSON"
  pattern:
    iban: "[A-Z]{2}[0-9]{2}[A-Z0-9]{1,30}"
    bic: "\b[a-zA-Z]{6}[2-9a-zA-Z]{1}[0-9a-np-zA-NP-Z]{1}(?:[0-9a-wy-zA-WY-Z]{1}[0-9a-zA-Z]{2}|[xX]{3}|)\b"
    email: "\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b"
    phone: "\b\(?\d{3}\)?[-\s]?\d{3}[-\s]?\d{4}\b"
    ssn: "\b\d{3}[-]?\d{2}[-]?\d{4}\b"
    ip_address_v4: "\b(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\b"
    ip_address_v6: "\b(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}\b"
    hostname: "\b(?:(?:[a-zA-Z]|[a-zA-Z][a-zA-Z0-9\-]*[a-zA-Z0-9])\.)*((?:[A-Za-z]|(?:[A-Za-z][A-Za-z0-9\-]*[A-Za-z0-9]))\.(?:[a-zA-Z]{2,})|(?:xn--[A-Za-z0-9]+))\b"
    uuid: "\b(?:[0-9a-fA-F]){8}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){12}\b"
